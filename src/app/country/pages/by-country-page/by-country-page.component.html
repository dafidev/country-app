<country-search-input
  placeholder="Search by country"
  (value)="onSearch($event)"
/>

@if (errorMessage()) {
<country-list
  [countries]="[]"
  [errorMessage]="errorMessage()"
  [isLoading]="isLoading()"
  [isEmpty]="countries().length == 0"
/>
}@else {
<country-list
  [countries]="countries()"
  [isLoading]="isLoading()"
  [isEmpty]="countries().length == 0"
/>
}
